[project]
name = "stacking"
version = "0.1.0"
description = "The real-space galaxy-intensity cross-correlation of DESI and SPHEREx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "astroquery>=0.4.11",
    "healpy>=1.19.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "talltable",
    "tqdm>=4.69.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
]

[tool.uv.sources]
talltable = { path = "../talltable/packages/core", editable = true }

[build-system]
requires = ["uv_build>=0.9.18,<0.14.0"]
build-backend = "uv_build"
